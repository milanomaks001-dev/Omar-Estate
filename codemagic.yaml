- name: Build and Sign APK
        script: |
          flutter build apk --release --no-obfuscate
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          keytool -genkey -v -keystore /tmp/key.jks -alias omar -keyalg RSA -keysize 2048 -validity 10000 -storepass omar123 -keypass omar123 -dname "CN=Omar" -noprompt
          $APKSIGNER sign --ks /tmp/key.jks --ks-pass pass:omar123 --key-pass pass:omar123 --ks-key-alias omar build/app/outputs/flutter-apk/app-release.apk
