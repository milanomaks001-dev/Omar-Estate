workflows:
  android-workflow:
    name: Omar Estate Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Generate icons
        script: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              img = Image.new('RGB', (size,size), color=(26,35,126))
              draw = ImageDraw.Draw(img)
              draw.ellipse([size//8,size//8,size*7//8,size*7//8], fill=(255,255,255))
              draw.text((size//3,size//3), 'O', fill=(26,35,126))
              path = f'android/app/src/main/res/{folder}/ic_launcher.png'
              img.save(path)
              print(f'Created {path}')
          "
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
